    access: RW
    reset_value: 0x00000000
    description: PCIe log snapshot periodic enable bits
    screen: pcie
    group: control
    poll_default: true
  - address: 0x000000C8
    name: PCIE_LOG_TRIGGER
    access: WO
    reset_value: 0x00000000
    description: Write-one trigger bits for PCIe log snapshots
    screen: pcie
    group: control
    poll_default: false
  - address: 0x000000D8
    name: PCIE_LINKUP_STATUS
    access: RO
    reset_value: 0x00000000
    description: PCIe link-up state mirror
    screen: pcie
    group: summary
    poll_default: true
  - address: 0x000000DC
    name: PCIE_LTSSM
    access: RO
    reset_value: 0x00000000
    description: PCIe LTSSM state mirror
    screen: pcie
    group: summary
    poll_default: true
    decoder:
      kind: enum
      field_name: ltssm
      lsb: 0
      width: 5
      values:
        0x00: detect.quiet
        0x01: detect.active
        0x02: polling.active
        0x03: polling.compliance
        0x04: polling.configuration
        0x05: config.linkwidthstart
        0x06: config.linkwidthaccept
        0x07: config.lanenumwait
        0x08: config.lanenumaccept
        0x09: config.complete
        0x0A: config.idle
        0x0B: recovery.receiverlock
        0x0C: recovery.equalization
        0x0D: recovery.speed
        0x0E: recovery.receiverconfig
        0x0F: recovery.idle
        0x10: L0
        0x11: L0s
        0x12: L1.entry
        0x13: L1.idle
        0x14: L2.idle_or_l2.transmitwake
        0x15: reserved
        0x16: disable
        0x17: loopback.entry
        0x18: loopback.active
        0x19: loopback.exit
        0x1A: hotreset
  - address: 0x000000E0
    name: PCIE_LAST_RX_ERROR
    access: RO
    reset_value: 0x00000000
    description: Last non-zero PCIe RX error code observed from the IP
    screen: pcie
    group: debug
    poll_default: true
    decoder:
      kind: bitset
      fields:
        - bit: 0
          name: ecrc_error
        - bit: 1
          name: invalid_tlp
        - bit: 2
          name: rx_buffer_read_error
        - bit: 3
          name: rx_config_data_packet
        - bit: 4
          name: unsupported_tlp_format
        - bit: 5
          name: acs_violation
