version: 1
default:
  level: INFO
  title: LOG
  message: "src=0x{src_id:02X} evt=0x{event_id:02X} ts={timestamp} arg0=0x{arg0_hex} arg1=0x{arg1_hex} arg2=0x{arg2_hex}"

"0x01:0x11":
  level: INFO
  title: HEARTBEAT
  message: "HEARTBEAT time={timestamp} count={arg0_u32}"

"0x02:0x06":
  level: INFO
  title: PCIE_RX_ACTIVITY0
  message: "PCIe RX activity beats={arg0_u32} sop={arg1_u32} eop={arg2_u32}"

"0x02:0x07":
  level: INFO
  title: PCIE_RX_ACTIVITY1
  message: "PCIe RX activity valid_nonzero={arg0_u32} bardec_nonzero={arg1_u32} rx_err_sticky=0x{arg2_hex}"

"0x02:0x08":
  level: INFO
  title: PCIE_TX_ACTIVITY0
  message: "PCIe TX activity beats={arg0_u32} sop={arg1_u32} eop={arg2_u32}"

"0x02:0x09":
  level: INFO
  title: PCIE_TX_ACTIVITY1
  message: "PCIe TX activity valid_nonzero={arg0_u32} fifo_full_drop={arg1_u32} tlp_overrun_drop={arg2_u32}"

"0x03:0x01":
  level: INFO
  title: PCIE_EP_STATUS
  decode: pcie_ep_status
  message: "PCIe sts ltssm={ltssm_curr_name} linkup={linkup_curr} rst_n={rst_pcie_100m_n_curr} rst_seen={rst_pcie_100m_asserted_curr} rx_err=0x{rx_err_curr_hex} sticky=0x{rx_err_sticky_hex} req_key=0x{req_key_hex} tx_wait={tx_wait_curr} mmio=0x{arg2_b1:02X} tx=0x{arg2_b2:02X} rx=0x{arg2_b3:02X}"

"0x03:0x02":
  level: INFO
  title: PCIE_EP_BRIDGE
  message: "PCIe bridge rx_len={arg0_b0} rx_avail={arg0_b1} tx_fifo={arg0_b2} irq=0x{arg0_b3:02X} last_bar0_addr=0x{arg1_u32:08X} last_bar0_access=0x{arg2_u32:08X}"

"0x02:0x20":
  level: INFO
  title: SDRAM_INIT_DONE
  message: "embedded SDRAM init done"

"0x02:0x21":
  level: INFO
  title: SDRAM_TEST_START
  message: "embedded SDRAM self-test start test_words={arg0_u32} bursts={arg1_u32} clear_words={arg2_u32}"

"0x02:0x22":
  level: INFO
  title: SDRAM_TEST_PASS
  message: "embedded SDRAM self-test pass clear_words={arg0_u32} verified_words={arg1_u32}"

"0x02:0x23":
  level: ERROR
  title: SDRAM_TEST_FAIL
  message: "embedded SDRAM self-test fail idx={arg0_u32} expected=0x{arg1_hex} actual=0x{arg2_hex}"

"0x02:0x24":
  level: DEBUG
  title: SDRAM_TEST_FAIL_CTX
  message: "embedded SDRAM self-test fail ctx burst_base_idx={arg0_u32} burst_addr=0x{arg1_hex} burst_seed=0x{arg2_hex}"

"0x02:0x25":
  level: DEBUG
  title: SDRAM_TEST_FAIL_WR
  message: "embedded SDRAM self-test fail write beats[22..24]=0x{arg0_hex},0x{arg1_hex},0x{arg2_hex}"

"0x02:0x26":
  level: DEBUG
  title: SDRAM_TEST_FAIL_RD
  message: "embedded SDRAM self-test fail read beats[22..24]=0x{arg0_hex},0x{arg1_hex},0x{arg2_hex}"

"0x03:0x30":
  level: INFO
  title: SDRAM_HOST_WRITE_ACK
  message: "embedded SDRAM host write ack addr=0x{arg0_hex} data=0x{arg1_hex} status=0x{arg2_hex}"

"0x03:0x31":
  level: INFO
  title: SDRAM_HOST_READ_RSP
  message: "embedded SDRAM host read response addr=0x{arg0_hex} data=0x{arg1_hex} status=0x{arg2_hex}"

"0x03:0x3E":
  level: ERROR
  title: SDRAM_HOST_CMD_ERR
  message: "embedded SDRAM host command error reason=0x{arg0_hex} cmd=0x{arg1_hex} detail=0x{arg2_hex}"

"0x01:0x30":
  level: INFO
  title: EEPROM_HOST_WRITE_ACK
  message: "EEPROM host write ack addr=0x{arg0_hex} data=0x{arg1_b0:02X} status=0x{arg2_hex}"

"0x01:0x31":
  level: INFO
  title: EEPROM_HOST_READ_RSP
  message: "EEPROM host read response addr=0x{arg0_hex} data=0x{arg1_b0:02X} status=0x{arg2_hex}"

"0x01:0x32":
  level: INFO
  title: EEPROM_HOST_BULK_OK
  message: "EEPROM bulk accepted addr=0x{arg0_hex} bytes={arg1_u32}"

"0x01:0x33":
  level: ERROR
  title: EEPROM_HOST_BULK_ERR
  message: "EEPROM bulk error reason=0x{arg0_hex} addr=0x{arg1_hex} detail=0x{arg2_hex}"

"0x01:0x34":
  level: INFO
  title: EEPROM_HOST_BULK_PROGRESS
  message: "EEPROM bulk progress meta=0x{arg0_hex} data0=0x{arg1_hex} data1=0x{arg2_hex}"

"0x01:0x35":
  level: INFO
  title: EEPROM_HOST_BULK_DONE
  message: "EEPROM bulk done addr=0x{arg0_hex} bytes={arg1_u32} completed={arg2_u32}"

"0x01:0x36":
  level: WARN
  title: EEPROM_HOST_BULK_ABORT
  message: "EEPROM bulk abort reason=0x{arg0_hex} addr=0x{arg1_hex} completed=0x{arg2_hex}"

"0x01:0x3E":
  level: ERROR
  title: EEPROM_HOST_CMD_ERR
  message: "EEPROM host command error reason=0x{arg0_hex} cmd=0x{arg1_hex} detail=0x{arg2_hex}"

"0x04:0x30":
  level: INFO
  title: SSD1331_CMD_ACK
  message: "SSD1331 command ack op=0x{arg0_b0:02X} color=0x{arg1_u32:06X}"

"0x04:0x3E":
  level: ERROR
  title: SSD1331_CMD_ERR
  message: "SSD1331 command error reason=0x{arg0_hex} detail=0x{arg1_hex}"

"0x05:0x30":
  level: INFO
  title: OCR_ACK
  message: "OCR inference started"

"0x05:0x31":
  level: WARN
  title: OCR_BUSY
  message: "OCR engine busy — request dropped"

"0x05:0x40":
  level: INFO
  title: OCR_RESULT
  message: "OCR result class={arg0_b2_u6} char=0x{arg0_b1:02X} score0={arg1_i32} score1={arg2_i32}"

"0x05:0x41":
  level: DEBUG
  title: OCR_CYCLES
  message: "OCR cycles total={arg0_u32} L0={arg1_u32} L1={arg2_u32}"
